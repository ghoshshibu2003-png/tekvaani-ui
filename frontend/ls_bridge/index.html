<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
/* Tiny bridge between the browser's localStorage and Streamlit (no extra packages).
   - First load: reads the saved State + Dialect and sends it to Python once.
   - Every render: if Python passes a State + Dialect, saves it. */
var KEY = "tekvaani_selection";
var sentFirst = false;

function send(type, extra) {
  var msg = { isStreamlitMessage: true, type: type };
  for (var k in extra) msg[k] = extra[k];
  window.parent.postMessage(msg, "*");
}

function readStored() {
  try {
    var raw = window.localStorage.getItem(KEY);
    var v = raw ? JSON.parse(raw) : null;
    if (v && typeof v.state === "string" && typeof v.dialect === "string") return v;
  } catch (e) {}
  return {};
}

window.addEventListener("message", function (event) {
  if (!event.data || event.data.type !== "streamlit:render") return;
  var args = event.data.args || {};
  if (args.state && args.dialect) {
    try { window.localStorage.setItem(KEY, JSON.stringify({ state: args.state, dialect: args.dialect })); } catch (e) {}
  }
  if (!sentFirst) {
    sentFirst = true;
    send("streamlit:setComponentValue", { value: readStored(), dataType: "json" });
  }
});

send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 0 });
</script>
</body>
</html>
